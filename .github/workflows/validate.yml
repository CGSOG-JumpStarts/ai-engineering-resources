name: validate-reference-package
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check documentation and skills
        run: python tools/validate_bundle.py
      - name: Test documentation helper safeguards
        run: python -m unittest discover -s 02-agent-skills/foundry-docs-advisor/tests -v
      - name: Run reference lab tests
        working-directory: 06-reference-lab
        run: python -m unittest discover -s tests -v
      - name: Validate acceptance criteria mapping
        working-directory: 06-reference-lab
        run: python scripts/validate_contracts.py
      - name: Evaluate golden cases
        working-directory: 06-reference-lab
        run: python scripts/evaluate.py
